messages:
  no_permission: '%prefix% &8• &7You do not have permission to execute this command.'

  main_usage:
    - '%prefix% &8• &7Available commands:'
    - ' &8» &f/gatekeeper whitelist add/remove (address/name/asn) &8- &7Adds/removes a whitelist entry'
    - ' &8» &f/gatekeeper blacklist add/remove (address/name/asn) &8- &7Adds/removes a blacklist entry'
    - ' &8» &f/gatekeeper info (address/name/asn) &8- &7Shows staff access-list information'
    - ' &8» &f/gatekeeper risk (player/ip) &8- &7Shows the latest security decision and evidence'
    - ' &8» &f/gatekeeper reload &8- &7Reloads GateKeeper configuration'

  updater:
    - '%prefix% &8• &7Fork updates are reviewed manually.'

  info:
    usage:
      - '%prefix% &8• &7Correct usage:'
      - ' &8» &f/gatekeeper info (address/name/asn)'
    player:
      - '&#FF5555Information about &f{}&#FF5555:'
      - '&#FF5555Access: &f{}'
    error: '%prefix% &8• &7Address, ASN, or player {} was not found in the staff access lists.'

  risk:
    usage:
      - '%prefix% &8• &7Correct usage:'
      - ' &8» &f/gatekeeper risk (player/ip) &8- &7Shows the most recent connection-security result.'
    error: '%prefix% &8• &7No recent security result was found for {}. Results expire after 30 minutes.'

  whitelist:
    usage:
      - '%prefix% &8• &7Correct usage:'
      - ' &8» &f/gatekeeper whitelist add (address/name/asn) &8- &7Adds an entry to the whitelist;'
      - ' &8» &f/gatekeeper whitelist remove (address/name/asn) &8- &7Removes an entry from the whitelist.'
    added: '%prefix% &8• &7{} has been whitelisted.'
    removed: '%prefix% &8• &7{} has been removed from the whitelist.'
    missing: '%prefix% &8• &7{} is not on the whitelist.'
    exists: '%prefix% &8• &7{} is already on the whitelist.'
    error: '%prefix% &8• &7Address, ASN, or player {} was not found.'

  blacklist:
    usage:
      - '%prefix% &8• &7Correct usage:'
      - ' &8» &f/gatekeeper blacklist add (address/name/asn) &8- &7Adds an entry to the blacklist;'
      - ' &8» &f/gatekeeper blacklist remove (address/name/asn) &8- &7Removes an entry from the blacklist.'
    added: '%prefix% &8• &7{} has been blacklisted.'
    removed: '%prefix% &8• &7{} has been removed from the blacklist.'
    missing: '%prefix% &8• &7{} is not on the blacklist.'
    exists: '%prefix% &8• &7{} is already on the blacklist.'
    error: '%prefix% &8• &7Address, ASN, or player {} was not found.'

  reload:
    config: '%prefix% &8• &7Configuration has been reloaded.'
    lang: '%prefix% &8• &7Language has been reloaded.'
