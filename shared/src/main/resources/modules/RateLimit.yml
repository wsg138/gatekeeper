enabled: true
priority: 2
log: "Connection from %address%/%name% rejected: connection flood limit exceeded! (ASN=%asn%, TIME=%time%ms, COUNTRY=%country%)"
kick:
  - "%prefix%"
  - ""
  - "&#FF5555Too many connection attempts."
  - "&#C7C7C7Wait a short time before trying to connect again."
  - ""
  - "&#8A8A8AIf you believe this is a mistake, open a ticket in our Discord."

values:
  window_seconds: 10
  burst_seconds: 2

  # Risk context starts before the direct hard limits, but does not block by
  # itself. Zero disables a threshold.
  risk_attempts_per_ip: 8
  risk_points: 60

  # Direct kicks are reserved for clearly extreme behavior so shared NATs and
  # restart reconnect waves are not collateral damage.
  hard_attempts_per_ip: 30
  hard_burst_per_ip: 12

  # Disabled by default. Global traffic volume cannot identify which individual
  # client is malicious and would otherwise kick innocent users during a DDoS.
  hard_server_attempts: 0
