enabled: false
priority: 6
log: "Connection from %address%/%name% rejected: blocked country! (ASN=%asn%, TIME=%time%ms, COUNTRY=%country%)"
kick:
  - "%prefix%"
  - ""
  - "&#FF5555Connections from your country are not currently allowed."
  - "&#C7C7C7This is a server policy restriction, not a VPN detection."
  - ""
  - "&#8A8A8AIf you believe this is a mistake, open a ticket in our Discord."
values:
  list_mode: false
  list:
    - "US"
    - "PL"
    - "UA"
    - "DE"
    - "GB"
    - "CZ"
    - "SK"
    - "FR"
    - "NL"
    - "SE"
    - "BE"
    - "DK"
