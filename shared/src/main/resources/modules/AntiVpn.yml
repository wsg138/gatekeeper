enabled: true
priority: 7
log: "Connection from %address%/%name% rejected: VPN/proxy/Tor consensus reached! (ASN=%asn%, TIME=%time%ms, COUNTRY=%country%)"

# Generic fallback. AntiVPN normally uses one of the specific kick_reasons below.
kick:
  - "%prefix%"
  - ""
  - "&#FF5555Connection blocked by network security."
  - "&#C7C7C7A VPN, proxy, or Tor connection was detected."
  - ""
  - "&#8A8A8AIf you believe this is a mistake, open a ticket in our Discord."

kick_reasons:
  vpn:
    - "%prefix%"
    - ""
    - "&#FF5555VPN detected."
    - "&#C7C7C7Disable your VPN and reconnect to the server."
    - ""
    - "&#8A8A8AIf you believe this is a mistake, open a ticket in our Discord."
  proxy:
    - "%prefix%"
    - ""
    - "&#FF5555Proxy detected."
    - "&#C7C7C7Disable your proxy and reconnect to the server."
    - ""
    - "&#8A8A8AIf you believe this is a mistake, open a ticket in our Discord."
  tor:
    - "%prefix%"
    - ""
    - "&#FF5555Tor connection detected."
    - "&#C7C7C7Tor connections are not allowed. Disconnect from Tor and try again."
    - ""
    - "&#8A8A8AIf you believe this is a mistake, open a ticket in our Discord."
  anonymizer:
    - "%prefix%"
    - ""
    - "&#FF5555VPN or proxy detected."
    - "&#C7C7C7Disable any VPN, proxy, or anonymizing service and reconnect."
    - ""
    - "&#8A8A8AIf you believe this is a mistake, open a ticket in our Discord."

values:
  # Maximum number of players that can be checked at the same time.
  max_concurrent_checks: 30

  # Maximum duration in milliseconds for a single provider request.
  timeout: 2500

  # Query three independent providers and require two positive providers.
  checks_per_player: 3
  block_threshold: 2

  # Exact-IP verdict caches. Incomplete checks are cached very briefly so API
  # outages/rate limits fail open without hammering providers every millisecond.
  cache_clean_minutes: 30
  cache_blocked_minutes: 15
  cache_incomplete_seconds: 60

  checks:
    # proxycheck.io v1 classifies VPNs/proxies together as proxy=yes, so this is
    # intentionally a generic anonymizer signal rather than pretending it knows
    # whether the connection is specifically a VPN or proxy.
    proxycheck_io:
      enabled: true
      url: "https://proxycheck.io/v1/%address%"
      signals:
        anonymizer:
          json: "proxy=yes"

    # No key required. Only the explicit proxy flag is allowed to vote.
    # The broader hosting flag is intentionally ignored to prevent false positives.
    ip-api_com:
      enabled: true
      url: "http://ip-api.com/json/%address%?fields=proxy"
      signals:
        proxy:
          json: "proxy=true"

    # Public/free endpoint. Datacenter classification is intentionally ignored.
    ipquery_io:
      enabled: true
      url: "https://api.ipquery.io/%address%?format=json"
      signals:
        vpn:
          json: "risk:is_vpn=true"
        proxy:
          json: "risk:is_proxy=true"
        tor:
          json: "risk:is_tor=true"

    # Optional extra provider. Enable after adding a key if the server needs more
    # capacity/redundancy. Without a key the daily quota is small.
    vpnapi_io:
      enabled: false
      url: "https://vpnapi.io/api/%address%?key={API_KEY}"
      signals:
        vpn:
          json: "security:vpn=true"
        proxy:
          json: "security:proxy=true"
        tor:
          json: "security:tor=true"

    # Optional extra provider. Enable after adding a key if desired.
    # Hosting/abuser fields are deliberately not blocking signals.
    iplocate_io:
      enabled: false
      url: "https://iplocate.io/api/lookup/%address%?apikey={API_KEY}"
      signals:
        vpn:
          json: "privacy:is_vpn=true"
        proxy:
          json: "privacy:is_proxy=true"
        tor:
          json: "privacy:is_tor=true"
