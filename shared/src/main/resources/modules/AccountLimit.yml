enabled: true
priority: 3
log: "Connection from %address%/%name% rejected: too many simultaneous accounts on this IP! (ASN=%asn%, TIME=%time%ms, COUNTRY=%country%)"
kick:
  - "%prefix%"
  - ""
  - "&#FF5555Too many accounts are connected from your network."
  - "&#C7C7C7Disconnect another account and try again."
  - ""
  - "&#8A8A8AIf this is a shared network and you believe this is a mistake, open a ticket in our Discord."

values:
  # Last-resort simultaneous-account ceiling. This is intentionally high because
  # families, dorms, schools and CGNAT can legitimately share one public IP.
  # Set to 0 to disable this hard cap entirely.
  per_ip_limit: 12

  # Rolling account velocity is risk context, not an automatic block. It becomes
  # actionable only when the central risk policy also has enough supporting evidence.
  velocity_window_minutes: 10
  risk_unique_accounts: 6
  risk_points: 50
