enabled: true
priority: 3
log: "Connection from %address%/%name% rejected: too many simultaneous accounts on this address! (ASN=%asn%, TIME=%time%ms, COUNTRY=%country%)"
kick:
  - "%prefix%"
  - ""
  - "&#FF5555Too many accounts are connected from your network."
  - "&#C7C7C7Disconnect another account and try again."
  - ""
  - "&#8A8A8AIf this is a shared network and you believe this is a mistake, open a ticket in our Discord."

values:
  # High emergency ceiling only. Shared households, schools, dorms and CGNAT can
  # legitimately share a public address. Set 0 to disable the hard cap entirely.
  per_ip_limit: 20

  # Rolling account velocity is risk context, not an automatic block. It only
  # becomes enforceable when combined with another strong behavior signal.
  velocity_window_minutes: 10
  risk_unique_accounts: 10
  risk_points: 50
