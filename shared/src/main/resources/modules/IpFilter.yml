enabled: true
priority: 5
log: "Connection from %address%/%name% rejected: hard-blocked network endpoint matched! (ASN=%asn%, TIME=%time%ms, COUNTRY=%country%)"

# Fallback for IPs manually added by staff.
kick:
  - "%prefix%"
  - ""
  - "&#FF5555This network has been blocked by server staff."
  - "&#C7C7C7You cannot connect from this IP address."
  - ""
  - "&#8A8A8AIf you believe this is a mistake, open a ticket in our Discord."

kick_reasons:
  tor:
    - "%prefix%"
    - ""
    - "&#FF5555Tor connection detected."
    - "&#C7C7C7Tor connections are not allowed. Disconnect from Tor and try again."
    - ""
    - "&#8A8A8AIf you believe this is a mistake, open a ticket in our Discord."

values:
  # Manual staff-managed IP list. The downloaded hard-block set is intentionally
  # limited to the official Tor exit list in config.yml.
  list_mode: true
  list: []
