# ASN-wide hard blocking is disabled by default in the Enthusia fork.
# ASN ownership is too coarse to safely treat as proof that an individual player
# is using a VPN/proxy. ASN data will be used as a weaker reputation signal by
# the risk engine instead.
enabled: false
priority: 4
log: "Connection from %address%/%name% rejected: ASN filter matched! (ASN=%asn%, TIME=%time%ms, COUNTRY=%country%)"
kick:
  - "%prefix%"
  - ""
  - "&#FF5555Your network is blocked by server security."
  - "&#C7C7C7If you believe this is a mistake, open a ticket in our Discord."
values:
  list_mode: true
  list: []
