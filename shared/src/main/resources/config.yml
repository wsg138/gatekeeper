# GateKeeper Enthusia defaults
# Designed for low false positives: hard blocks require strong evidence, while
# broad hosting/scanner/abuse intelligence is reputation context only.

main:
  prefix: "&#54DAF4ɢ&#54CCEDᴀ&#54BEE6ᴛ&#54B1DFᴇ&#54A3D8ᴋ&#5495D2ᴇ&#5487CBᴇ&#547AC4ᴘ&#546CBDᴇ&#545EB6ʀ"
  prefix_hover: false

  # Upstream update notices are disabled in the fork. Updates are reviewed and
  # merged intentionally so upstream releases cannot overwrite fork behavior.
  updater: false

  bStats:
    enabled: false

  command:
    permission: "gatekeeper.command"
    aliases:
      - gk
      - antibot
      - antivpn
      - novpn

  auto_updater:
    enabled: true
    interval: 12

    # ASN-wide hard blocking is intentionally unused by default.
    asn_sources: []

    # IMPORTANT: this legacy GeoIP list is a HARD BLOCK. Keep it extremely small.
    # We only use the official Tor exit list here because an exact Tor exit match
    # is strong enough to block without relying on broad IP reputation.
    proxy_sources:
      - "https://check.torproject.org/torbulkexitlist?ip=1.1.1.1"

  # These sources NEVER directly kick a player. They only contribute one risk
  # signal per category, no matter how many overlapping feeds contain the IP.
  reputation:
    sources:
      vpn_ip:
        - "https://raw.githubusercontent.com/O-X-L/risk-db-lists/refs/heads/main/ip/kind_vpn.txt"
        - "https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/vpn/ipv4.txt"
        - "https://raw.githubusercontent.com/Coocoobau/vpn-ip-lists/main/nordvpn-ips.txt"
        - "https://raw.githubusercontent.com/Coocoobau/vpn-ip-lists/main/protonvpn-ips.txt"
        - "https://raw.githubusercontent.com/Coocoobau/vpn-ip-lists/main/windscribevpn-ips.txt"

      proxy_ip:
        - "https://raw.githubusercontent.com/O-X-L/risk-db-lists/refs/heads/main/ip/kind_proxy.txt"
        - "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt"
        - "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks4.txt"
        - "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt"

      hosting_ip:
        - "https://raw.githubusercontent.com/O-X-L/risk-db-lists/refs/heads/main/ip/kind_hosting.txt"
        - "https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/datacenter/ipv4.txt"

      scanner_ip:
        - "https://raw.githubusercontent.com/O-X-L/risk-db-lists/refs/heads/main/ip/kind_scanner.txt"

      abuse_ip:
        - "https://raw.githubusercontent.com/O-X-L/risk-db-lists/refs/heads/main/ip/top_10000.txt"
        - "https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level1.netset"
        - "https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/stopforumspam_7d.ipset"
        - "https://cinsscore.com/list/ci-badguys.txt"
        - "https://lists.blocklist.de/lists/all.txt"
        - "https://blocklist.greensnow.co/greensnow.txt"

      vpn_asn:
        - "https://raw.githubusercontent.com/O-X-L/risk-db-lists/refs/heads/main/asn/kind_vpn.txt"
        - "https://raw.githubusercontent.com/X4BNet/lists_vpn/refs/heads/main/input/vpn/ASN.txt"

      hosting_asn:
        - "https://raw.githubusercontent.com/O-X-L/risk-db-lists/refs/heads/main/asn/kind_hosting.txt"
        - "https://raw.githubusercontent.com/X4BNet/lists_vpn/refs/heads/main/input/datacenter/ASN.txt"

      scanner_asn:
        - "https://raw.githubusercontent.com/O-X-L/risk-db-lists/refs/heads/main/asn/kind_scanner.txt"
